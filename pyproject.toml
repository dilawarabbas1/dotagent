[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotagent"
version = "0.5.4"
description = "Tool-agnostic AI coding assistant context manager. One source of truth, every tool in sync."
authors = [{ name = "dotagent contributors" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "anthropic>=0.40",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]
ml = ["numpy>=1.26", "scikit-learn>=1.4", "sentence-transformers>=2.7"]
server = ["fastapi>=0.110", "uvicorn>=0.30", "starlette>=0.36"]
watch = ["watchdog>=4.0"]
all = ["dotagent[ml,server,watch]"]

[project.scripts]
dotagent = "dotagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dotagent"]

[tool.hatch.build.targets.wheel.force-include]
"src/dotagent/scaffolds" = "dotagent/scaffolds"

[tool.ruff]
line-length = 100
target-version = "py311"
