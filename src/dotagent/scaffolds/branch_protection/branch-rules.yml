# GitHub Actions workflow scaffolded by `dotagent git scaffold-protection`.
# Verifies every PR's changes against the rules declared in `.agent/git.yaml`.
# Combine with branch protection ("Require status checks to pass before merging")
# to enforce server-side.
name: branch-rules

on:
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dotagent
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/dilawarabbas/dotagent@main"
      - name: Compute changed files
        id: files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only "$base" "$head")
          echo "$files" > /tmp/changed.txt
          echo "n=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
      - name: Verify against branch rules
        run: |
          branch="${{ github.event.pull_request.base.ref }}"
          remote="$(git remote get-url origin)"
          # Build --paths arguments
          args=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            args+=" --paths $f"
          done < /tmp/changed.txt
          dotagent git verify --branch "$branch" --remote "$remote" $args
